<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - فلوسك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                            300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <script src="/static/lang.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .glass-card {
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }
        :is(.dark .glass-card) {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.15);
        }
        :is(html:not(.dark) .glass-card) {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(226, 232, 240, 1);
        }
        .input-field {
            transition: all 0.3s ease;
        }
        :is(.dark .input-field) { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(99, 102, 241, 0.2); }
        :is(html:not(.dark) .input-field) { background: rgba(248, 250, 252, 0.8); border: 1px solid rgba(203, 213, 225, 1); color: #0f172a; }
        }
        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            outline: none;
        }
        .tab-active { border-bottom: 2px solid #6366f1; }
        :is(.dark .tab-active) { color: white; } :is(html:not(.dark) .tab-active) { color: #0f172a; }
        .tab-inactive { border-bottom: 2px solid transparent; }
        :is(.dark .tab-inactive) { color: #94a3b8; } :is(html:not(.dark) .tab-inactive) { color: #64748b; }
        :is(.dark .tab-inactive:hover) { color: #cbd5e1; } :is(html:not(.dark) .tab-inactive:hover) { color: #334155; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-brand-500 to-purple-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg shadow-brand-500/30">⚡</div>
            <h1 class="text-3xl font-bold gradient-text">فلوسك</h1>
            <p class="text-slate-600 dark:text-slate-400 mt-2" data-lang-key="login-subtitle">سجّل دخولك وابدأ توفير فلوسك</p>
            <div class="flex justify-center gap-3 mt-3">
                <button onclick="Theme.toggle()" class="flsk-theme-btn flex items-center justify-center w-8 h-8 bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:border-brand-500 rounded-lg text-sm transition" title="تبديل المظهر">☀️</button>
                <button onclick="Lang.set(Lang.get()==='ar'?'en':'ar')" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:border-brand-500 text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition" id="flsk-lang-btn">🌐 English</button>
            </div>
        </div>

        <!-- Card -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl">
            <!-- Tabs -->
            <div class="flex mb-8 border-b border-slate-700">
                <button id="tab-login" class="flex-1 pb-3 text-center font-semibold tab-active transition" onclick="switchTab('login')" data-lang-key="tab-login">تسجيل الدخول</button>
                <button id="tab-register" class="flex-1 pb-3 text-center font-semibold tab-inactive transition" onclick="switchTab('register')" data-lang-key="tab-register">حساب جديد</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" class="space-y-5">
                <div>
                    <label class="block text-slate-600 dark:text-slate-300 text-sm font-semibold mb-2" data-lang-key="lbl-email">البريد الإلكتروني</label>
                    <input type="email" id="login-email" class="input-field w-full px-4 py-3 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500" placeholder="your@email.com" required>
                </div>
                <div>
                    <label class="block text-slate-600 dark:text-slate-300 text-sm font-semibold mb-2" data-lang-key="lbl-password">كلمة المرور</label>
                    <input type="password" id="login-password" class="input-field w-full px-4 py-3 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-login" class="w-full bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 text-white py-3.5 rounded-xl font-bold text-lg transition transform hover:scale-[1.02] shadow-lg shadow-brand-500/25" data-lang-key="btn-login">
                    دخول
                </button>
            </form>

            <!-- Register Form -->
            <form id="form-register" class="space-y-5 hidden">
                <div>
                    <label class="block text-slate-600 dark:text-slate-300 text-sm font-semibold mb-2" data-lang-key="lbl-name">الاسم الكامل</label>
                    <input type="text" id="reg-name" class="input-field w-full px-4 py-3 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500" placeholder="محمد أحمد">
                </div>
                <div>
                    <label class="block text-slate-600 dark:text-slate-300 text-sm font-semibold mb-2" data-lang-key="lbl-email">البريد الإلكتروني</label>
                    <input type="email" id="reg-email" class="input-field w-full px-4 py-3 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500" placeholder="your@email.com" required>
                </div>
                <div>
                    <label class="block text-slate-600 dark:text-slate-300 text-sm font-semibold mb-2" data-lang-key="lbl-password">كلمة المرور</label>
                    <input type="password" id="reg-password" class="input-field w-full px-4 py-3 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500" placeholder="••••••••" required minlength="8">
                </div>
                <button type="submit" id="btn-register" class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white py-3.5 rounded-xl font-bold text-lg transition transform hover:scale-[1.02] shadow-lg shadow-green-500/25" data-lang-key="btn-register">
                    إنشاء حساب
                </button>
            </form>

            <!-- Message -->
            <div id="msg-box" class="mt-4 text-center text-sm hidden"></div>
        </div>

        <!-- Back -->
        <div class="text-center mt-6">
            <a href="/" class="text-slate-500 dark:text-slate-400 hover:text-brand-500 transition text-sm" data-lang-key="back-home">← الرجوع للصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.host}`;

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            if (tab === 'login') {
                loginForm.classList.remove('hidden'); registerForm.classList.add('hidden');
                loginTab.classList.add('tab-active'); loginTab.classList.remove('tab-inactive');
                registerTab.classList.add('tab-inactive'); registerTab.classList.remove('tab-active');
            } else {
                loginForm.classList.add('hidden'); registerForm.classList.remove('hidden');
                registerTab.classList.add('tab-active'); registerTab.classList.remove('tab-inactive');
                loginTab.classList.add('tab-inactive'); loginTab.classList.remove('tab-active');
            }
            hideMsg();
        }

        function showMsg(text, isError = true) {
            const box = document.getElementById('msg-box');
            box.textContent = text;
            box.className = `mt-4 text-center text-sm ${isError ? 'text-red-400' : 'text-green-400'}`;
            box.classList.remove('hidden');
        }

        function hideMsg() { document.getElementById('msg-box').classList.add('hidden'); }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault(); hideMsg();
            const btn = document.getElementById('btn-login');
            btn.textContent = '...'; btn.disabled = true;
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('login-email').value);
            formData.append('password', document.getElementById('login-password').value);
            try {
                const res = await fetch(`${API_URL}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    showMsg(Lang.get()==='ar' ? 'تم تسجيل الدخول! جاري التحويل...' : 'Logged in! Redirecting...', false);
                    setTimeout(async () => {
                        try {
                            const dr = await fetch(`${API_URL}/device/status`, { headers: { 'Authorization': `Bearer ${data.access_token}` } });
                            const dd = await dr.json();
                            window.location.href = dd.device_id ? '/dashboard' : '/claim';
                        } catch { window.location.href = '/claim'; }
                    }, 800);
                } else {
                    showMsg(data.detail || (Lang.get()==='ar' ? 'فشل تسجيل الدخول' : 'Login failed'));
                    btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 300);
                }
            } catch { showMsg(Lang.get()==='ar' ? 'خطأ في الاتصال' : 'Connection error'); }
            finally { btn.textContent = Lang.t('btn-login'); btn.disabled = false; }
        });

        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault(); hideMsg();
            const btn = document.getElementById('btn-register');
            btn.textContent = '...'; btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/auth/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('reg-email').value, password: document.getElementById('reg-password').value, full_name: document.getElementById('reg-name').value }) });
                const data = await res.json();
                if (res.ok) {
                    showMsg(Lang.get()==='ar' ? 'تم إنشاء الحساب! سجّل دخولك.' : 'Account created! Sign in now.', false);
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showMsg(data.detail || (Lang.get()==='ar' ? 'فشل إنشاء الحساب' : 'Registration failed'));
                    btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 300);
                }
            } catch { showMsg(Lang.get()==='ar' ? 'خطأ في الاتصال' : 'Connection error'); }
            finally { btn.textContent = Lang.t('btn-register'); btn.disabled = false; }
        });
    </script>
    <script src="/static/chat-widget.js"></script>
</body>
</html>
