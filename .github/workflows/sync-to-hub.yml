name: Sync to Hugging Face Hub
on:
  push:
    branches: [main] # هيشتغل لما ترفع كودك على فرع main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # عشان يسحب ملفات الـ LFS لو موجودة

      - name: Sync to Hugging Face
        uses: huggingface/hub-sync@v0.2.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: salahkhafaga/flosk-energy-detector
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker

      - name: Restart Hugging Face Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf spaces restart salahkhafaga/flosk-energy-detector